[env:seeed_xiao_esp32s3]
platform = espressif32@8.0.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Arduino's C/C++ build adds the ESP32-S3 Xtensa headers via -iprefix.
; Assembly files (ESP-DSP) do not, so include_next cannot find core-isa.h.
extra_scripts = pre:asm_includes.py
; Edge Impulse's vendored ESP-DSP/ESP-NN headers are not on PlatformIO's
; default include path. These match the include dirs in the SDK's Zephyr CMake.
build_flags =
    -Dasm=__asm__
    -Ilib/a5s-Gaitgaurd_inferencing/src/edge-impulse-sdk
    -Ilib/a5s-Gaitgaurd_inferencing/src/edge-impulse-sdk/porting
    -Ilib/a5s-Gaitgaurd_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/common/include
    -Ilib/a5s-Gaitgaurd_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/fft/include
    -Ilib/a5s-Gaitgaurd_inferencing/src/edge-impulse-sdk/porting/espressif/ESP-NN
    -Ilib/a5s-Gaitgaurd_inferencing/src/edge-impulse-sdk/porting/espressif/ESP-NN/include